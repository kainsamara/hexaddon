[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
; Веб-интерфейс (data/index.html) вшит в прошивку: scripts/embed_index.py
; на каждой сборке регенерирует src/index_html.h (gzip + PROGMEM) и сервер
; отдаёт его из памяти. OTA обновляет и прошивку, и страницу одним файлом.
extra_scripts = pre:scripts/embed_index.py

; ESP32-C3 с найтивным USB (SuperMini / DevKitM-1):
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSH110X_NO_SPLASH
    ; HTTP хэндлеры + JSON + отрисовка выполняется в стеке loopTask
    -DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit SH110X@^2.1.4
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.1.7
    bblanchon/ArduinoJson@^7.4.0
